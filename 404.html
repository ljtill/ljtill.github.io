<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <title>404 - Lyon Till</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" fetchpriority="low">
    <style>
      @layer reset, base, layout, components;

      @layer reset {
        *,
        *::before,
        *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
      }

      @layer base {
        :root {
          --font-family: system-ui, sans-serif;
          --text-body: clamp(0.95rem, 0.9rem + 0.25vw, 1.0625rem);
          --color-text: light-dark(#1a1a1a, #d4d4d4);
          --color-text-muted: light-dark(#555, #888);
          --color-bg: light-dark(#fff, #0a0a0a);
        }

        html {
          color-scheme: light dark;
        }

        body {
          font-family: var(--font-family);
          font-size: var(--text-body);
          color: var(--color-text);
          background-color: var(--color-bg);
          line-height: 1.5;
          min-block-size: 100dvh;
        }
      }

      @layer layout {
        .error {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-block-size: 100dvh;
          gap: 0.5rem;

          & h1 {
            font-size: clamp(2rem, 1.5rem + 2.5vw, 3rem);
            font-weight: 300;
            text-wrap: balance;
          }

          & p {
            font-weight: 300;
            text-wrap: pretty;
            color: var(--color-text-muted);
          }
        }
      }
    </style>
  </head>
  <body>
    <main class="error">
      <h1>404</h1>
      <p>Couldn't find what you're looking for.</p>
    </main>
  </body>
</html>
