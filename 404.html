<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <meta name="description" content="The page you're looking for doesn't exist.">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
    <meta name="robots" content="noindex">
    <title>Page not found · Lyon Till</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <style>
      @layer reset, base, layout, components;

      @layer reset {
        *,
        *::before,
        *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
      }

      @layer base {
        :root {
          --font-family: system-ui, sans-serif;
          --space-sm: 1rem;
          --space-lg: 2.5rem;
          --text-body: clamp(0.95rem, 0.9rem + 0.25vw, 1.0625rem);
          --text-display: clamp(2rem, 1.5rem + 2.5vw, 3rem);
          --color-text: light-dark(#1a1a1a, #d4d4d4);
          --color-text-muted: light-dark(#555, #888);
          --color-bg: light-dark(#fff, #0a0a0a);
        }

        html {
          color-scheme: light dark;
        }

        body {
          font-family: var(--font-family);
          font-size: var(--text-body);
          color: var(--color-text);
          background-color: var(--color-bg);
          line-height: 1.5;
          min-block-size: 100dvh;
        }
      }

      @layer layout {
        .error {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-block-size: 100dvh;
          gap: 0.5rem;
          padding-inline: var(--space-sm);
          text-align: center;
        }
      }

      @layer components {
        .error {
          & h1 {
            font-size: var(--text-display);
            font-weight: 300;
            text-wrap: balance;
          }

          & p {
            font-weight: 300;
            text-wrap: pretty;
            color: var(--color-text-muted);
          }

          & a {
            margin-block-start: var(--space-sm);
            font-weight: 300;
            color: var(--color-text-muted);
            text-decoration-color: var(--color-text-muted);
            text-underline-offset: 0.2em;
            transition: color 0.2s;

            &:hover,
            &:focus-visible {
              color: var(--color-text);
            }

            @media (prefers-reduced-motion: reduce) {
              transition: none;
            }
          }
        }
      }
    </style>
  </head>
  <body>
    <main class="error">
      <h1>Page not found</h1>
      <p>The page you're looking for doesn't exist.</p>
      <a href="/">Back to home</a>
    </main>
  </body>
</html>
