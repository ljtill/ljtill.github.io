<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>404 - Lyon Till</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" fetchpriority="low" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap"
    />
    <style>
      @layer reset, base, layout;

      @layer reset {
        *,
        *::before,
        *::after {
          box-sizing: border-box;
          margin: 0;
          padding: 0;
        }
      }

      @layer base {
        :root {
          --color-text: light-dark(#1a1a1a, #d4d4d4);
          --color-text-muted: light-dark(#555, #888);
          --color-bg: light-dark(#fff, #0a0a0a);
        }

        html {
          color-scheme: light dark;
        }

        body {
          font-family: "Outfit", system-ui, sans-serif;
          font-synthesis: none;
          letter-spacing: -0.01em;
          color: var(--color-text);
          background-color: var(--color-bg);
          line-height: 1.5;
          min-block-size: 100dvh;
        }
      }

      @layer layout {
        .error {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          min-block-size: 100dvh;
          gap: 0.5rem;

          & h1 {
            font-size: clamp(2rem, 1.5rem + 2.5vw, 3rem);
            font-weight: 300;
            text-wrap: balance;
          }

          & p {
            font-weight: 300;
            color: var(--color-text-muted);
          }
        }
      }
    </style>
  </head>
  <body>
    <main class="error">
      <h1>404</h1>
      <p>Couldn't find what you're looking for.</p>
    </main>
  </body>
</html>
